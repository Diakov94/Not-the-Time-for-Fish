<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Не час для рибки</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--night);
        color: var(--paper);
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* The screens (GAME.md, UI mood: chunky, playful, readable at a glance). Every colour is a palette
         slot the screens write on the root (parts.ts); every size is in em of one base, a fortieth of the
         height of the largest 16:9 box the window holds (18 px at 1280x720, 27 px at 1920x1080) times the
         viewer's text scale, --scale on the root. A control is never under 44 px either way. */
      .room,
      .screen {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: safe center;
        gap: 0.7em;
        padding: 1em;
        overflow-y: auto;
        font-size: calc(2.5 * min(1vh, 0.5625vw) * var(--scale, 1));
        font-weight: 700;
        background: radial-gradient(ellipse at 50% 35%, var(--wood), var(--night) 75%);
      }
      .screen[hidden] {
        display: none;
      }
      .room h1,
      .screen h1,
      .screen h2,
      .room p,
      .screen p {
        margin: 0;
      }
      .room h1,
      .screen h1 {
        font-size: 2.4em;
        font-weight: 900;
        line-height: 1.05;
        color: var(--star);
        text-shadow:
          0 0.05em 0 var(--poppy),
          0 0.1em 0 var(--ink);
      }
      .screen h2 {
        font-size: 1.1em;
        font-weight: 900;
      }
      .band {
        flex: none;
        align-self: stretch;
        height: 1.1em;
        background: var(--band) repeat-x left / auto 100%;
        border-radius: 0.2em;
      }
      .room button,
      .screen button,
      .room input {
        box-sizing: border-box;
        min-width: 44px;
        min-height: 44px;
        padding: 0.4em 0.9em;
        font: inherit;
        font-weight: 800;
        color: var(--ink);
        border: 0.12em solid var(--ink);
        border-radius: 0.6em;
      }
      .room button,
      .screen button {
        background: var(--brass);
        box-shadow: 0 0.16em 0 var(--ink);
        cursor: pointer;
      }
      .room button:hover,
      .screen button:hover {
        background: var(--star);
      }
      .room button:active,
      .screen button:active {
        transform: translateY(0.1em);
        box-shadow: 0 0.06em 0 var(--ink);
      }
      .room button:focus-visible,
      .screen button:focus-visible,
      .room input:focus-visible {
        outline: 0.14em solid var(--paper);
        outline-offset: 0.14em;
      }
      .room button.quiet,
      .screen button.quiet {
        background: var(--linen);
      }
      .room input {
        background: var(--paper);
        text-align: center;
      }
      .voice {
        font-size: 0.8em;
        opacity: 0.85;
      }
      .room .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7em;
        width: 34em;
        padding: 1.4em 1.6em;
        text-align: center;
        background: color-mix(in srgb, var(--ink) 25%, transparent);
        border: 0.12em solid color-mix(in srgb, var(--linen) 25%, transparent);
        border-radius: 1em;
      }
      .room .field {
        display: flex;
        flex-direction: column;
        gap: 0.3em;
        align-self: stretch;
      }
      .room .ways {
        display: flex;
        align-items: center;
        gap: 0.6em;
        align-self: stretch;
      }
      .room .ways > button {
        flex: none;
        white-space: nowrap;
      }
      .room .join {
        flex: 1;
        display: flex;
        gap: 0.5em;
      }
      .room .join input {
        flex: 1;
        min-width: 0;
      }
      .room .status {
        min-height: 1.3em;
        color: var(--star);
      }
      .lobby header,
      .lobby .teams,
      .lobby footer {
        box-sizing: border-box;
        width: min(100%, 66em);
      }
      .lobby header {
        display: flex;
        align-items: center;
        gap: 1em;
      }
      .lobby h1 {
        flex: 1;
        font-size: 1.8em;
      }
      .lobby header button {
        flex: none;
      }
      .lobby .score {
        color: var(--star);
      }
      .lobby .teams {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1em;
      }
      .side {
        display: flex;
        flex-direction: column;
        gap: 0.5em;
        min-width: 0;
        padding: 0.7em 0.8em;
        background: color-mix(in srgb, var(--ink) 25%, transparent);
        border: 0.12em solid color-mix(in srgb, var(--linen) 25%, transparent);
        border-radius: 1em;
      }
      .side h2 {
        align-self: flex-start;
        padding: 0.15em 0.6em;
        border-radius: 0.4em;
      }
      .team-a h2 {
        background: var(--team-a);
        color: var(--ink);
      }
      .team-b h2 {
        background: var(--team-b);
        color: var(--paper);
      }
      .side h3 {
        margin: 0;
        font-size: 0.85em;
      }
      .side .players {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.4em;
      }
      .screen .player {
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        column-gap: 0.4em;
        min-height: 44px;
        padding: 0.2em 0.5em;
        font-size: 0.85em;
        text-align: left;
        color: var(--paper);
        background: color-mix(in srgb, var(--paper) 10%, transparent);
        border: 0.12em solid transparent;
        border-radius: 0.5em;
        box-shadow: none;
      }
      .screen button.player:hover {
        background: color-mix(in srgb, var(--paper) 20%, transparent);
        border-color: var(--star);
      }
      .player img {
        width: 2.2em;
        height: 2.2em;
      }
      .player b {
        overflow-wrap: anywhere;
      }
      .player span,
      .player small {
        font-size: 0.85em;
        opacity: 0.8;
      }
      .pick .row {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 0.35em;
      }
      .screen .character {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 0.1em;
        min-width: 0;
        padding: 0.3em 0.1em;
        font-size: 0.7em;
        line-height: 1.15;
        background: var(--linen);
        overflow-wrap: break-word;
      }
      .screen .character[aria-pressed='true'] {
        background: var(--star);
        outline: 0.2em solid var(--paper);
      }
      .character img {
        width: 100%;
        max-width: 5em;
        aspect-ratio: 1;
      }
      .signature {
        min-height: 2.4em;
        font-size: 0.75em;
        opacity: 0.9;
      }
      .lobby footer {
        display: flex;
        align-items: center;
        gap: 1em;
      }
      .lobby footer .tip {
        flex: 1;
        font-size: 0.8em;
        opacity: 0.85;
      }
      .lobby .start {
        padding: 0.5em 1.4em;
        font-size: 1.15em;
      }
      .screen button.leave {
        background: var(--cherry);
        color: var(--paper);
      }
      .results {
        gap: 0.6em;
      }
      .results > * {
        box-sizing: border-box;
        width: min(100%, 44em);
      }
      .results h1 {
        width: auto;
      }
      .results .band {
        align-self: center;
      }
      .results .rounds {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1em;
      }
      .panel {
        display: flex;
        flex-direction: column;
        gap: 0.4em;
        padding: 0.6em 1em;
        background: color-mix(in srgb, var(--ink) 25%, transparent);
        border: 0.12em solid color-mix(in srgb, var(--linen) 25%, transparent);
        border-radius: 1em;
      }
      .panel h2 {
        align-self: flex-start;
        padding: 0.15em 0.6em;
        border-radius: 0.4em;
      }
      .panel .label {
        font-size: 0.8em;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.85;
      }
      .results .match {
        align-items: center;
        text-align: center;
      }
      .results .match h2 {
        align-self: center;
        font-size: 1.4em;
      }
      .results .score {
        color: var(--star);
      }
      .results footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1em;
      }
      .results .start {
        padding: 0.5em 1.4em;
        font-size: 1.15em;
      }
      .hint {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        padding: 6px 10px;
        color: var(--paper);
        background: color-mix(in srgb, var(--ink) 60%, transparent);
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
      }
      .hint.seen {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
