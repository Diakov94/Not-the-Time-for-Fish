<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Не час для рибки</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1d2330;
        color: #f4f1ea;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .room {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #1d2330;
      }
      .room h1 {
        margin: 0 0 12px;
      }
      .room p {
        margin: 0;
      }
      .room button,
      .room input {
        width: 240px;
        padding: 10px;
        font: inherit;
        font-size: 18px;
        text-align: center;
      }
      .lobby {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #1d2330;
      }
      .lobby[hidden] {
        display: none;
      }
      .lobby h1,
      .lobby h2,
      .lobby p {
        margin: 0;
      }
      .lobby h2 {
        font-size: 18px;
      }
      .lobby button {
        padding: 6px 10px;
        font: inherit;
      }
      .lobby [aria-pressed='true'] {
        outline: 2px solid #f2c14e;
      }
      .teams {
        display: flex;
        gap: 24px;
      }
      .teams section {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 360px;
      }
      .teams button,
      .teams p {
        text-align: left;
      }
      .looks {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .host {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border: 1px solid #f2c14e;
      }
      .hint {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        padding: 6px 10px;
        background: rgb(0 0 0 / 0.5);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
