# ui-diff-check.sh: what is logic and what is the UI Developer's zone (ADR 0003).
# render is a view of the sim and app/screens are the DOM screens. The camera and the
# frame interpolation in render are display timing: read them in any delivery anyway.
LOGIC_GLOBS=('*.ts' '*.tsx' '*.js' '*.mjs')
UI_GLOBS=('src/render/*' 'src/app/screens/*' '*.css' '*.html' '*.svg')
