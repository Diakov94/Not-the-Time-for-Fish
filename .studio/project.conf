# The project profile for the studio's instruments and specs (gamestudio/PORTING.md).
# Sourced by bash. Written by the Producer on 2026-09-24 from ADR 0003, on the owner's go.
# A command marked "after card NN" does not work until that card lands.

TRUNK=develop

# After card 01 (the toolchain).
INSTALL_CMD="npm ci"
# tsc --noEmit, eslint, the two zone greps of ADR 0003, vitest; after card 12 also a 10 s two-client headless game.
GATES_CMD="npm run gates"
# The MVP's QA scenarios (cards 63-66); a QA pass names one scenario and client count per worker.
HEADLESS_GAMES_CMD="npm run headless -- --scenario round --clients 3"
# Others: --scenario round --clients 8; --scenario mines-and-traps --clients 4;
#         --scenario chase-kennel-rescue-rejoin --clients 4; --scenario round --clients 6 --seconds 120 --rounds 2
# No screenshot capture in the Prototype: it arrives with the room screen (card 10) as its own card.
SHOTS_CMD=""

# Code zones (ADR 0003, ADR 0008, ADR 0011). A card names one of them on its first line.
ZONES=("src/sim" "src/net" "src/relay" "src/render" "src/app" "tools/headless" "src/content" "src/audio" "src/hud" "src/art" "src/settings" "src/input" "src/meta")

# The line count of STUDIO.md section 1. Tests and the headless clients are instruments
# (GAME.md: headless test clients are dev tooling, not a feature).
PROD_FIND="find src -type f \( -name '*.ts' -o -name '*.html' \) ! -name '*.test.ts'"
STYLE_FIND="find src -type f -name '*.css'"
TEST_FIND="find src tools -type f \( -name '*.test.ts' -o -path 'tools/*' \)"
DOC_FIND="find docs -type f -name '*.md'"

# work-check.sh: production code by extension (package-lock.json is not code).
PROD_EXT=".ts,.tsx,.css,.html"

# Worktrees: Orca creates them in ~/orca/workspaces/gaming-studio/<name>, outside the project,
# so no gate has a worktree folder to exclude; health-check.sh already counts /orca/workspaces/
# as the work area, so WORKTREES_DIR is left at its default.
